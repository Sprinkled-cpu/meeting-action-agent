services:
  - type: web
    name: meeting-action-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "uvicorn meeting_action_agent.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEFAULT_LLM_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: meeting-action-dashboard
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -e . && pip install streamlit"
    startCommand: "streamlit run web/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: APP_ENV
        value: production
